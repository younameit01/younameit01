<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="100" viewBox="0 0 1200 100" role="img" aria-label="Always something to build."><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#141124"/><stop offset="1" stop-color="#0b1720"/></linearGradient><linearGradient id="accent"><stop stop-color="#b99aff"/><stop offset="1" stop-color="#76f2c8"/></linearGradient></defs><style>text{font-family:DejaVu Sans,Arial,sans-serif}.mono{font-family:DejaVu Sans Mono,monospace}.blink{animation:blink 1.4s step-end infinite}.float{animation:float 6s ease-in-out infinite}@keyframes blink{50%{opacity:0}}@keyframes float{50%{transform:translateY(-6px)}}@media(prefers-reduced-motion:reduce){.blink,.float{animation:none}}</style><path d="M0 48 Q180 5 360 48 T720 48 T1080 48 T1440 48" stroke="#b99aff" stroke-opacity=".3" fill="none"/><path d="M0 55 Q180 12 360 55 T720 55 T1080 55 T1440 55" stroke="#79efc6" stroke-opacity=".25" fill="none"/><rect x="414" y="24" width="372" height="44" rx="22" fill="#171925" stroke="#333447"/><text x="600" y="52" text-anchor="middle" font-size="14" letter-spacing="2" fill="#b6acc9">ALWAYS SOMETHING TO BUILD.</text></svg>